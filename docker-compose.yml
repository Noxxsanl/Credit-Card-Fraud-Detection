# Hệ thống chạy bằng một lệnh: docker compose up (docs/06 §7.1, docs/10 §4).
#
# Giai đoạn 7 mới có dịch vụ db — dựng TRƯỚC khi viết route (rủi ro R-09). Hai dịch
# vụ api và web thêm ở giai đoạn 9 (T-58).
#
# Cổng máy chủ đọc từ POSTGRES_HOST_PORT trong .env, mặc định 5432. Máy đã có một
# PostgreSQL khác chiếm 5432 thì đặt POSTGRES_HOST_PORT=5433 và sửa DATABASE_URL
# tương ứng (docs/10 §2.3).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
