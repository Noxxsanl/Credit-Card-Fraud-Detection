[pytest]
pythonpath = .
testpaths = tests
# Ca đo hiệu năng (perf) phụ thuộc tải của máy nên không chạy trong lượt mặc định.
# Chạy riêng: pytest -m perf   (lệnh này ghi đè -m của addopts)
addopts = -q -m "not perf"
markers =
    perf: đo thời gian thực (NFR-01) — kết quả dao động theo tải CPU, chạy riêng bằng -m perf
