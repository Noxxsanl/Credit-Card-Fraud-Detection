# nginx của dịch vụ web — dùng chung cho cả hai bản giao diện (frontend/Dockerfile, web/Dockerfile).
#
# Hai việc:
#   /api/…  → chuyển tiếp sang dịch vụ api:8000. Trình duyệt chỉ thấy MỘT origin (cổng 3000), nên
#             không phụ thuộc CORS và vẫn chạy khi mở trang bằng địa chỉ IP hay cổng khác.
#   còn lại → tệp tĩnh của giao diện.
# Cổng 8000 vẫn mở ra máy chủ cho http://localhost:8000/docs và cho lúc phát triển.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /threshold → /threshold/ phải là chuyển hướng tương đối. Tuyệt đối thì nginx ghi cổng 80
    # của container vào Location và trình duyệt nhảy khỏi cổng 3000.
    absolute_redirect off;

    # 100 MB là giới hạn của API (NFR-06). Để rộng hơn một chút cho phần đầu multipart, để
    # chính API trả lỗi PAYLOAD_TOO_LARGE theo đúng mô hình lỗi của docs/05 §4.
    client_max_body_size 110m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    # Không có text/event-stream: nén luồng SSE thì nginx gom sự kiện lại, phát lại bị giật
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    # DNS nội bộ của Docker. Phân giải "api" lúc có yêu cầu, không phải lúc nginx khởi động:
    # nginx không chết khi api chưa lên, và vẫn đúng sau khi container api được tạo lại với IP mới.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API-15 /replay/stream là SSE: chuyển từng sự kiện ngay, giữ kết nối lâu
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Lỗi do chính nginx sinh ra cũng theo mô hình lỗi của API (docs/05 §4), không phải
        # trang HTML. Lỗi của API thì đi thẳng qua (proxy_intercept_errors mặc định tắt).
        error_page 502 504 = @api_unavailable;      # api đang khởi động hoặc đã dừng
        error_page 413 = @payload_too_large;
    }

    location @api_unavailable {
        default_type "application/json; charset=utf-8";
        add_header Cache-Control "no-store" always;
        return 503 '{"error":{"code":"API_UNAVAILABLE","message":"API chưa sẵn sàng — đang khởi động hoặc đã dừng (docker compose logs api)","details":null}}';
    }

    location @payload_too_large {
        default_type "application/json; charset=utf-8";
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Tệp vượt giới hạn 100 MB","details":null}}';
    }

    # Tệp của Next.js mang mã băm trong tên: lưu đệm vĩnh viễn
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # Trang và tệp không mang mã băm: luôn hỏi lại (ETag), để build mới có hiệu lực ngay
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
