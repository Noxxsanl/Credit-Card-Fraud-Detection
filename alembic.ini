# Alembic - luoc do PostgreSQL duoi dang ma (docs/06 S5).
# Tep nay chi dung ASCII: Alembic doc no bang bang ma mac dinh cua he dieu hanh (cp1252 tren Windows).
#
#   alembic upgrade head        # dung hoac nang luoc do; chay lai khi da moi nhat thi khong lam gi
#   alembic downgrade -1        # lui mot buoc
#   alembic revision --autogenerate -m "mo ta"   # doc lai tep sinh ra truoc khi dung
#
# URL co so du lieu lay tu bien moi truong DATABASE_URL (hoac .env), khong ghi o day.

[alembic]
script_location = %(here)s/api/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
